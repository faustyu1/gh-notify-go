# Bundled Postgres, for a deployment with no cluster of its own. Overlay it:
#
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d
#
# and point DATABASE_URL at the db service:
#
#   DATABASE_URL=postgres://gh:<POSTGRES_PASSWORD>@db:5432/ghnotify?sslmode=disable
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ghnotify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gh -d ghnotify"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
