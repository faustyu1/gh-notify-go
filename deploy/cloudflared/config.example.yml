# Cloudflare Tunnel: cloudflared держит исходящее соединение до Cloudflare,
# входящих портов на сервере нет вообще, поэтому его IP наружу не виден.
# Скопируй этот файл в deploy/cloudflared/config.yml и подставь свои значения.
#
#   cloudflared tunnel login
#   cloudflared tunnel create ghnotify
#   cloudflared tunnel route dns ghnotify notify.example.com
#   cp ~/.cloudflared/<TUNNEL-ID>.json deploy/cloudflared/
#
#   GitHub App → Webhook URL: https://notify.example.com/gh/webhook
#   GitHub App → Setup URL:   https://notify.example.com/github/setup

tunnel: <TUNNEL-ID>
credentials-file: /etc/cloudflared/<TUNNEL-ID>.json

# Наружу торчат только два публичных пути, остальное — 404, как в Caddyfile
# и nginx.conf. `bot` — имя сервиса из docker-compose.yml.
ingress:
  - hostname: notify.example.com
    path: ^/(gh/webhook|github/setup)$
    service: http://bot:8080
  - service: http_status:404
