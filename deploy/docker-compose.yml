services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Points at your Postgres cluster; sslmode=require unless it is reachable
      # only over a private network. For a bundled database instead, add
      # docker-compose.local-db.yml — see deploy/.env.example.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:?set BOT_USERNAME}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set GITHUB_APP_ID}
      GITHUB_SLUG: ${GITHUB_SLUG:?set GITHUB_SLUG}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    secrets:
      - github_app_key
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # /healthz pings Postgres, so an unhealthy container means an actually
      # unhealthy bot, not just a live process.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

secrets:
  github_app_key:
    file: ./secrets/github-app.pem
