services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ghnotify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gh -d ghnotify"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gh:${POSTGRES_PASSWORD}@db:5432/ghnotify?sslmode=disable
      BOT_TOKEN: ${BOT_TOKEN:?set BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME:?set BOT_USERNAME}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?set GITHUB_APP_ID}
      GITHUB_SLUG: ${GITHUB_SLUG:?set GITHUB_SLUG}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET}
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    secrets:
      - github_app_key
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # /healthz pings Postgres, so an unhealthy container means an actually
      # unhealthy bot, not just a live process.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

secrets:
  github_app_key:
    file: ./secrets/github-app.pem

volumes:
  pgdata:
