# Base locale: every user-visible string of the bot. The other locales must
# keep the exact same key set — a test enforces that.

# The language's own name, shown in the language pickers.
lang:
  name: English

nav:
  back: "Back"

format:
  # Go time layout for short timestamps in messages.
  datetime: "Jan 2, 15:04"

# Buttons reused across screens. Plain emoji travel with the label because
# Telegram button captions cannot carry entities.
btn:
  connect_github: "Connect GitHub"
  repos: "Repositories"
  chats: "Chats"
  status: "Status"
  settings: "Settings"
  add_to_chat: "Add to chat"
  home: "Home"
  more_accounts: "Another account"
  configure_access: "Configure access"
  prev_page: "Newer"
  next_page: "Older"
  connect_to_chat: "Connect to chat"
  open_github: "Open on GitHub"
  install_app: "Install GitHub App"
  installed: "I've installed it"
  events: "Events"
  health: "Health"
  filters: "Filters"
  disconnect: "Disconnect"
  set_topic: "Set topic"
  topic_general: "General chat"
  topic_new: "New topic"
  unmute: "Unmute"
  configure: "Configure"
  add_to_group: "Add to group"
  admin: "Admin panel"
  connect_gitlab: "Connect GitLab"
  open_gitlab: "Open on GitLab"
  gitlab_projects: "Projects"
  gitlab_webhook: "Webhook settings"
  gitlab_delete: "Delete connection"
  gitlab_delete_yes: "Yes, delete"
  refresh: "Refresh"

home:
  greeting: "Connect GitHub or GitLab and repository events will arrive in your chats."
  accounts: "Accounts"
  repos: "Repositories"
  chats: "Chats"

accounts:
  empty: "No GitHub or GitLab accounts are connected yet."
  title: "Accounts"
  hint: "Pick where the repository lives."

repos:
  empty: "No repositories are selected for this installation.\n\nOpen the GitHub App settings and add repositories."
  count: "Repositories: {n}"
  page: "   ·   page {n}/{total}"

repo_detail:
  hint: "Pick the chat this repository's events should go to."

install:
  title: "Connecting GitHub"
  body: "Tap the button below, pick an account or organization, and mark the repositories you need. GitHub will bring you back here after the install."

gitlab:
  unnamed: "GitLab"
  hook_title: "GitLab webhook"
  hook_body: "1. In GitLab open the project (or group) → <b>Settings → Webhooks</b> → <b>Add new webhook</b>.\n2. URL:\n<code>{url}</code>\n3. Secret token:\n<code>{token}</code>\n4. Triggers: push and tag push events, comments, issues, merge requests, pipelines, wiki pages, deployments, releases.\n5. Save and press <b>Test → Push events</b>: the project will appear in the list.\n\nOne token works for any number of projects and groups."
  projects_title: "GitLab · {name}"
  projects_empty: "No events from GitLab yet.\n\nAdd the webhook to a project or a group and press “Test” in its settings — the project will appear here."
  projects_count: "Projects: {n}"
  delete_confirm: "Delete this GitLab connection?\n\nIts repositories stop sending events to every chat, and GitLab deliveries with this token will be refused. Remove the webhook in GitLab as well."

chat_picker:
  empty: "The bot has not been added to any of your chats yet.\n\nAdd it to a group and the chat will show up here."
  title: "Where to deliver"

add_to_chat:
  title: "Add to chat"
  body: "Tap the button and pick a group — the bot will appear there and immediately send a settings button.\n\nAfter that the group shows up in the list when you connect a repository."

result:
  ok: "<b>Done</b>\n\n{name} is connected.\nEvents are already flowing — you can tune them in the “Chats” section."
  not_admin: "<b>Administrator rights required</b>\n\nOnly a chat administrator can connect repositories to it and change its settings."
  not_owner: "<b>Connected by another administrator</b>\n\nOnly the admin who connected this repository — or the chat's owner — can disconnect it."
  topic_failed: "<b>Topic not created</b>\n\nThe chat needs topics enabled and the bot needs the “Manage topics” right."
  duplicate: "<b>Already connected</b>\n\n{name} already sends events to this chat."
  error: "<b>Didn't work</b>\n\nTry again a little later."

chats:
  empty: "No chats with connected repositories yet."
  title: "Chats"
  hint: "A chat with connected repositories can be muted or pointed at a topic."
  entry: "{title} · {n}"

chat_detail:
  muted_until: "Muted until {time}"
  active: "Notifications are on"
  topic: "Topic: <code>{id}</code>"
  mute: "{h}h"
  language: "Language"

# The forum topic picker. Telegram cannot list a chat's topics, so this
# screen offers the ones the bot has seen plus a topic it creates itself.
topics:
  title: "Topic"
  hint: "Pick where this chat's notifications land. A topic is only listed once the bot has seen it."
  empty: "No topics seen here yet. Send /start inside the topic you want, then open this screen again — or let the bot create one."
  unnamed: "Topic {id}"
  # Name of the topic the bot creates on request.
  new_name: "GitHub"

integration_detail:
  hint: "What would you like to set up for this repository?"
  not_owner: "Another administrator connected this repository, so disconnecting it is up to them or the chat owner."

events:
  title: "Events"
  hint: "Presets on top, individual types below."
  preset_all: "Everything"
  preset_important: "Important only"
  preset_none: "Nothing"

filters:
  title: "Filters"
  empty: "Nothing is ignored yet."
  hint: "Matching events are not sent:"
  entry: "{kind}: {value}"
  add: "+ {label}"
  kind:
    author: "Author"
    branch: "Branch"
    label: "Label"
    action: "Action"

health:
  title: "Health"
  broken: "<b>Broken:</b> {reason}"
  muted_until: "Chat is muted until {time}"
  last_event: "Last event: {time}"
  no_events: "No events yet"
  sent24h: "Delivered in 24h: <b>{n}</b>"
  failed24h: "Not delivered: <b>{n}</b>"

status:
  title: "Status"
  summary: "Accounts: <b>{accounts}</b> · repositories: <b>{repos}</b> · chats: <b>{chats}</b>"
  delivered24h: "Delivered in 24h: <b>{n}</b>"
  failed24h: "Not delivered: <b>{n}</b> — see the “Chats” section"

settings:
  title: "Settings"
  stars_line: "Stars: one notification per user per repository — ever"
  rate_line: "Send limit: <b>{n}</b> messages per minute per chat, the rest folds into a digest"
  language: "Language"

placeholder:
  body: "This section is still in the works."

# The DM side of the bot: ForceReply prompts and one-off notices.
prompt:
  filter: "Send a pattern for the filter ({kind}). You may use *."
  filter_invalid: "⚠️ The pattern is empty or too long."

greeting:
  # Sent once when the bot lands in a group.
  body: "Setup happens in a private chat."
  button: "Configure"

delivery:
  # DM to the integration owner when a job fails permanently.
  failed_title: "Delivery failed"
  failed_line: "{repo} → chat {chat}"

# ── Event notifications ─────────────────────────────────────────────────────
# Headlines are whole sentences, because word order differs between languages.

ev:
  push:
    pushed: "{user} pushed to {branch} — {commits}"
    forced: "{user} force-pushed to {branch} — {commits}"
    commits:
      one: "{n} commit"
      other: "{n} commits"
    omitted: "…and {n} more"
    commit_line: "• {sha}{author} {title}"
    commit_author: "<i>({user})</i>"
    compare: "View changes"

  pull_request:
    merged: "{user} merged pull request {link}"
    closed: "{user} closed pull request {link}"
    reopened: "{user} reopened pull request {link}"
    ready_for_review: "{user} marked pull request {link} ready for review"
    draft: "{user} opened a draft pull request {link}"
    opened: "{user} opened pull request {link}"
    ref_pair: "<code>{head}</code> → <code>{base}</code>"
    diffstat:
      one: " +{additions} −{deletions} in {files} file"
      other: " +{additions} −{deletions} in {files} files"

  issues:
    opened: "{user} opened issue {link}"
    closed: "{user} closed issue {link}"
    reopened: "{user} reopened issue {link}"

  issue_comment:
    line: "{user} commented on issue {link}"
    pr_line: "{user} commented on pull request {link}"

  pull_request_review:
    approved: "{user} approved pull request {link}"
    changes_requested: "{user} requested changes on pull request {link}"
    commented: "{user} commented on pull request {link}"

  pull_request_review_comment:
    line: "{user} left a review comment on pull request {link}"

  commit_comment:
    line: "{user} commented on commit {sha}"

  release:
    line: "{user} released {link}"
    prerelease: "pre-release"

  workflow_run:
    line: "Workflow «{name}» — {verdict} · <code>{branch}</code>"
    by: "By {user}"
    view_run: "View run"

  check_suite:
    line: "Check suite {verdict} · <code>{branch}</code>"

  verdict:
    finished: "finished"
    success: "passed"
    failure: "failed ({conclusion})"

  fork:
    line: "{user} forked to {link}"

  member:
    added: "{user} added collaborator {member}"
    removed: "{user} removed collaborator {member}"

  gollum:
    line: "{user} updated the wiki:"
    page: "{name} ({action})"

  public:
    now_public: "is now public!"
    opened: "{user} made the repository public"

  ref:
    created: "{user} created {ref}"
    deleted: "{user} deleted {ref}"
    branch_created: "{user} created branch {ref}"
    branch_deleted: "{user} deleted branch {ref}"
    tag_created: "{user} created tag {ref}"
    tag_deleted: "{user} deleted tag {ref}"

  deployment:
    started: "{user} started a deployment to <code>{env}</code>"

  deployment_status:
    success: "deployed to <code>{env}</code>"
    failure: "deployment to <code>{env}</code> failed"

  star:
    single: "{user} starred the repository"
    multi:
      one: "+{n} star: {actors}"
      other: "+{n} stars: {actors}"
    total: "Total: <b>{n}</b>"

  digest:
    line: "Too many events in one minute — {n} more: {list}"

  gitlab:
    merge_request:
      opened: "{user} opened merge request {link}"
      draft: "{user} opened a draft merge request {link}"
      closed: "{user} closed merge request {link}"
      reopened: "{user} reopened merge request {link}"
      merged: "{user} merged merge request {link}"
      approved: "{user} approved merge request {link}"
    note:
      merge_request: "{user} commented on merge request {link}"
      snippet: "{user} commented on snippet {link}"
    pipeline:
      line: "Pipeline #{id} — {verdict} · <code>{branch}</code>"
      failed: "failed"
      canceled: "canceled"
      view: "View pipeline"
    release:
      line: "Release {link} published"

  detail: "Details"
  report: "Report"

# The bot owner's panel (/admin). Only aggregate numbers are shown there.
admin:
  title: "Admin panel"
  users_line: "Users: <b>{n}</b> · +{new} today"
  active_line: "Active today: <b>{n}</b>"
  btn_stats: "Statistics"
  btn_refs: "Referral links"
  btn_broadcast: "Broadcast"
  btn_refresh: "Refresh"
  stats:
    title: "Statistics"
    privacy: "Totals only — no repositories, chats or names."
    users: "Users"
    total: "Total: <b>{n}</b>"
    new: "New: <b>{d}</b> day · <b>{w}</b> week · <b>{m}</b> month"
    active: "Active: <b>{d}</b> day · <b>{w}</b> week · <b>{m}</b> month"
    from_refs: "Came via referral links: <b>{n}</b>"
    blocked: "Blocked the bot: <b>{n}</b>"
    funnel: "Funnel"
    with_github: "connected GitHub: <b>{n}</b> · {pct}"
    with_integration: "connected a repository: <b>{n}</b> · {pct}"
    volume: "Volume"
    volume_line: "App installs: <b>{installs}</b> · chats: <b>{chats}</b> · connections: <b>{integrations}</b>"
    delivery: "Delivery"
    delivery_line: "Queued: <b>{pending}</b> · sent last hour: <b>{sent}</b> · failed in 7 days: <b>{failed}</b>"
    languages: "Languages"
  refs:
    title: "Referral links"
    hint: "Each link counts taps and new users, so ad placements can be compared."
    empty: "No links yet. Create one per placement and name it after where the ad runs."
    summary: "Links: <b>{links}</b> · users brought: <b>{users}</b>"
    entry: "{name} · {n}"
    new: "New link"
  ref:
    created: "Created {time}"
    funnel: "Funnel"
    starts: "Taps: <b>{n}</b>"
    users: "new users: <b>{n}</b> · {pct}"
    connected: "connected GitHub: <b>{n}</b> · {pct}"
    active: "connected a repository: <b>{n}</b> · {pct}"
    share: "Share"
    delete: "Delete"
    confirm: "Delete this link? People who came through it stay, just unattributed, and new taps stop being counted."
    confirm_yes: "Yes, delete"
    cancel: "Cancel"
  broadcasts:
    title: "Broadcast"
    hint: "Your message is copied to every user as is — formatting, photos, videos and files included."
    audience: "Recipients: <b>{n}</b>"
    history: "Recent broadcasts:"
    new: "New broadcast"
    entry: "#{id} · {status} · {sent}/{total}"
  broadcast:
    title: "Broadcast #{id}"
    draft: "The message above goes to <b>{n}</b> recipients. Check it, then send."
    send: "Send"
    cancel: "Cancel"
    stop: "Stop"
    sent: "Delivered: <b>{n}</b>"
    failed: "Not delivered: <b>{n}</b>"
    started: "Started {time}"
    finished: "Finished {time}"
    done_notice: "Broadcast #{id} finished: delivered {sent} of {total}."
    status:
      draft: "draft"
      running: "sending"
      done: "finished"
      cancelled: "stopped"
  prompt:
    ref_name: "What should this link be called? For example “@devnews channel” or “reddit, September”."
    ref_name_invalid: "⚠️ The name is empty or longer than 64 characters."
    broadcast: "Send the message to broadcast — text, photo, video, a file. Formatting is kept."
