  active: "Benachrichtigungen aktiv"
  topic: "Thema: <code>{id}</code>"
  mute: "🔇 {h} Std."
  language: "Sprache"

# The forum topic picker. Telegram cannot list a chat's topics, so this
# screen offers the ones the bot has seen plus a topic it creates itself.
topics:
  title: "Thema"
  hint: "Wähle, wohin die Benachrichtigungen dieses Chats gehen. Ein Thema erscheint erst, wenn der Bot es gesehen hat."
  empty: "Noch keine Themen gesehen. Sende /start im gewünschten Thema und öffne diesen Bildschirm erneut — oder lass den Bot eins anlegen."
  unnamed: "Thema {id}"
  # Name of the topic the bot creates on request.
  new_name: "GitHub"

integration_detail:
  hint: "Was möchtest du für dieses Repository einstellen?"
  not_owner: "Dieses Repository hat ein anderer Administrator verbunden — trennen kann es nur er oder der Besitzer des Chats."

