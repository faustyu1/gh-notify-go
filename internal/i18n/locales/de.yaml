home:
  greeting: "Verbinde GitHub, GitLab, Gitea, Forgejo oder GitVerse, und die Ereignisse deiner Repositories kommen in deine Chats."
  accounts: "Konten"
  repos: "Repositories"
  chats: "Chats"

accounts:
  empty: "Noch keine Konten verbunden."
  title: "Konten"
  hint: "Wähle, wo das Repository liegt."

repos:
  empty: "Für diese Installation sind keine Repositories ausgewählt.\n\nÖffne die Einstellungen der GitHub App und füge Repositories hinzu."
