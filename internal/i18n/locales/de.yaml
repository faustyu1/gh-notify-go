  page: "   ·   S. {n}/{total}"

repo_detail:
  hint: "Wähle den Chat, in den die Ereignisse dieses Repositorys gehen sollen."

install:
  title: "GitHub verbinden"
  body: "Tippe unten auf die Schaltfläche, wähle ein Konto oder eine Organisation und markiere die benötigten Repositories. GitHub bringt dich nach der Installation hierher zurück."

forge:
  hook_title: "{name}-Webhook"
  hook:
    gitlab: "1. Öffne in GitLab das Projekt (oder die Gruppe) → <b>Settings → Webhooks</b> → <b>Add new webhook</b>.\n2. URL:\n<code>{url}</code>\n3. Secret token:\n<code>{token}</code>\n4. Auslöser: Push und Tag-Push, Kommentare, Issues, Merge Requests, Pipelines, Wiki, Deployments, Releases.\n5. Speichern und <b>Test → Push events</b> drücken: das Projekt erscheint in der Liste.\n\nEin Token reicht für beliebig viele Projekte und Gruppen."
    gitea: "1. Öffne in Gitea das Repository (oder die Organisation) → <b>Einstellungen → Webhooks</b> → <b>Webhook hinzufügen → Gitea</b>.\n2. Ziel-URL:\n<code>{url}</code>\n3. Content-Type: <b>application/json</b>.\n4. Secret:\n<code>{token}</code>\n5. Auslöser: Push, Anlegen und Löschen von Branches und Tags, Issues, Kommentare, Pull Requests, Reviews, Releases, Wiki.\n6. Speichern, den Webhook öffnen und <b>Test-Zustellung</b> drücken: das Repository erscheint in der Liste.\n\nAdresse und Secret reichen für beliebig viele Repositories."
    forgejo: "1. Öffne in Forgejo (auch auf Codeberg) das Repository (oder die Organisation) → <b>Einstellungen → Webhooks</b> → <b>Webhook hinzufügen → Forgejo</b>.\n2. Ziel-URL:\n<code>{url}</code>\n3. Content-Type: <b>application/json</b>.\n4. Secret:\n<code>{token}</code>\n5. Auslöser: Push, Anlegen und Löschen von Branches und Tags, Issues, Kommentare, Pull Requests, Reviews, Releases, Wiki.\n6. Speichern, den Webhook öffnen und <b>Test-Zustellung</b> drücken: das Repository erscheint in der Liste.\n\nAdresse und Secret reichen für beliebig viele Repositories."
    gitverse: "1. Öffne in GitVerse das Repository → <b>Einstellungen → Webhooks</b> → füge einen Webhook vom Typ <b>Custom URL</b> hinzu.\n2. URL:\n<code>{url}</code>\n3. Authorization-Header:\n<code>{token}</code>\n4. Ereignisse: alle oder ausgewählte — Push, Pull Requests, Issues, Kommentare, Releases.\n5. Speichern und eine Zustellung unter <b>Letzte Zustellungen</b> erneut senden (oder pushen): das Repository erscheint in der Liste.\n\nGitVerse erreicht nur die Ports 80 und 443, die Adresse des Bots muss also einen davon nutzen."
  projects_title: "{provider} · {name}"
  projects_empty: "Noch keine Ereignisse von {provider}.\n\nFüge den Webhook zu einem Repository hinzu und sende aus seinen Einstellungen eine Test-Zustellung — das Repository erscheint dann hier."
  projects_count: "Repositories: {n}"
  delete_confirm: "Diese {provider}-Verbindung löschen?\n\nIhre Repositories senden keine Ereignisse mehr an die Chats, und Zustellungen dafür werden abgewiesen. Entferne den Webhook auch in {provider}."

connect:
  title: "Weitere Plattformen"
  body: "GitLab, Gitea, Forgejo und GitVerse werden per Webhook verbunden: Der Bot gibt dir eine Adresse und ein Secret, die du in einem Repository, Projekt oder einer Gruppe einträgst."

chat_picker:
  empty: "Der Bot ist noch in keinem deiner Chats.\n\nFüge ihn zu einer Gruppe hinzu, dann erscheint der Chat hier."
  title: "Wohin liefern"

add_to_chat:
  title: "Zum Chat hinzufügen"
  body: "Tippe auf die Schaltfläche und wähle eine Gruppe — der Bot erscheint dort und schickt sofort eine Einstellungs-Schaltfläche.\n\nDanach erscheint die Gruppe in der Liste, wenn du ein Repository verbindest."

result:
  ok: "<b>Fertig</b>\n\n{name} ist verbunden.\nDie Ereignisse laufen bereits — anpassen kannst du sie im Bereich „Chats“."
  not_admin: "<b>Administratorrechte nötig</b>\n\nNur ein Chat-Administrator kann Repositories verbinden."
  not_owner: "<b>Von einem anderen Administrator verbunden</b>\n\nNur wer dieses Repository verbunden hat — oder der Besitzer des Chats — kann es trennen."
  topic_failed: "<b>Thema nicht erstellt</b>\n\nIm Chat müssen Themen aktiviert sein und der Bot braucht das Recht „Themen verwalten“."
  duplicate: "<b>Bereits verbunden</b>\n\n{name} schickt bereits Ereignisse in diesen Chat."
  error: "<b>Hat nicht geklappt</b>\n\nVersuche es gleich noch einmal."

