repo_detail:
  hint: "Wähle den Chat, in den die Ereignisse dieses Repositorys gehen sollen."

install:
  title: "GitHub verbinden"
  body: "Tippe unten auf die Schaltfläche, wähle ein Konto oder eine Organisation und markiere die benötigten Repositories. GitHub bringt dich nach der Installation hierher zurück."

chat_picker:
  empty: "Der Bot ist noch in keinem deiner Chats.\n\nFüge ihn zu einer Gruppe hinzu, dann erscheint der Chat hier."
  title: "Wohin liefern"

add_to_chat:
  title: "Zum Chat hinzufügen"
  body: "Tippe auf die Schaltfläche und wähle eine Gruppe — der Bot erscheint dort und schickt sofort eine Einstellungs-Schaltfläche.\n\nDanach erscheint die Gruppe in der Liste, wenn du ein Repository verbindest."

result:
  ok: "<b>Fertig</b>\n\n{name} ist verbunden.\nDie Ereignisse laufen bereits — anpassen kannst du sie im Bereich „Chats“."
  not_admin: "<b>Administratorrechte nötig</b>\n\nNur ein Chat-Administrator kann Repositories verbinden."
  not_owner: "<b>Von einem anderen Administrator verbunden</b>\n\nNur wer dieses Repository verbunden hat — oder der Besitzer des Chats — kann es trennen."
  topic_failed: "<b>Thema nicht erstellt</b>\n\nIm Chat müssen Themen aktiviert sein und der Bot braucht das Recht „Themen verwalten“."
  duplicate: "<b>Bereits verbunden</b>\n\n{name} schickt bereits Ereignisse in diesen Chat."
  error: "<b>Hat nicht geklappt</b>\n\nVersuche es gleich noch einmal."

chats:
  empty: "Noch keine Chats mit verbundenen Repositories."
  title: "Chats"
  hint: "Ein Chat mit verbundenen Repositories kann stummgeschaltet oder auf ein Thema gerichtet werden."
