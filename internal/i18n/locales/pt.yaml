  btn_refs: "Links de indicação"
  btn_broadcast: "Transmissão"
  btn_refresh: "Atualizar"
  stats:
    title: "Estatísticas"
    privacy: "Só totais — sem repositórios, chats ou nomes."
    users: "Usuários"
    total: "Total: <b>{n}</b>"
    new: "Novos: <b>{d}</b> dia · <b>{w}</b> semana · <b>{m}</b> mês"
