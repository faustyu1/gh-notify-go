    send: "Enviar"
    cancel: "Descartar"
    stop: "Parar"
    sent: "Entregues: <b>{n}</b>"
    failed: "Não entregues: <b>{n}</b>"
    started: "Iniciada em {time}"
    finished: "Concluída em {time}"
    done_notice: "Transmissão #{id} concluída: {sent} de {total} entregues."
