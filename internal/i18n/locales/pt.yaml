    languages: "Idiomas"
  refs:
    title: "Links de indicação"
    hint: "Cada link conta os toques e os usuários novos, para comparar os anúncios."
    empty: "Ainda não há links. Crie um por anúncio e dê o nome do lugar onde ele roda."
    summary: "Links: <b>{links}</b> · usuários trazidos: <b>{users}</b>"
    entry: "{name} · {n}"
    new: "Novo link"
  ref:
    created: "Criado em {time}"
    funnel: "Funil"
    starts: "Toques: <b>{n}</b>"
    users: "usuários novos: <b>{n}</b> · {pct}"
    connected: "conectaram o GitHub: <b>{n}</b> · {pct}"
    active: "conectaram um repositório: <b>{n}</b> · {pct}"
    share: "Compartilhar"
    delete: "Excluir"
    confirm: "Excluir o link? Quem chegou por ele continua, só sem atribuição, e novos toques deixam de ser contados."
