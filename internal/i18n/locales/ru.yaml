    view_run: "Подробнее"

  check_suite:
    line: "Чек-сьют {verdict} · <code>{branch}</code>"

  verdict:
    finished: "завершился"
    success: "прошёл"
    failure: "упал ({conclusion})"

  fork:
    line: "{user} форкнул в {link}"

  member:
    added: "{user} добавил соавтора {member}"
    removed: "{user} исключил соавтора {member}"

  gollum:
    line: "{user} обновил вики:"
    page: "{name} ({action})"

  public:
    now_public: "теперь открытый!"
    opened: "{user} открыл репозиторий"

  ref:
