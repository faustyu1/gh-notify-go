result:
  ok: "<b>Готово</b>\n\n{name} подключён.\nСобытия уже идут — настроить их можно в разделе «Чаты»."
  not_admin: "<b>Нужны права администратора</b>\n\nПодключать репозитории к чату и менять его настройки может только его администратор."
