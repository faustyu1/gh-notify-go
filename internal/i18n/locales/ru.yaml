  language: "Язык"

# The forum topic picker. Telegram cannot list a chat's topics, so this
# screen offers the ones the bot has seen plus a topic it creates itself.
topics:
  title: "Топик"
  hint: "Выбери, куда присылать уведомления этого чата. Топик попадает в список после того, как бот его увидел."
  empty: "Топики пока не замечены. Отправь /start внутри нужного топика и открой этот экран снова — или пусть бот создаст свой."
  unnamed: "Топик {id}"
  # Name of the topic the bot creates on request.
  new_name: "GitHub"

integration_detail:
  hint: "Что настроить для этого репозитория?"
  not_owner: "Этот репозиторий подключил другой администратор — отключить его может он сам или владелец чата."

events:
  title: "События"
  hint: "Пресеты сверху, отдельные типы ниже."
