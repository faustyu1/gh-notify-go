placeholder:
  body: "Этот раздел ещё в работе."

prompt:
  filter: "Пришли шаблон для фильтра («{kind}»). Можно использовать *."
  filter_invalid: "⚠️ Шаблон пустой или слишком длинный."

greeting:
  body: "Настройка — в личных сообщениях."
  button: "Настроить"

delivery:
  failed_title: "Доставка не удалась"
  failed_line: "{repo} → чат {chat}"

ev:
  push:
    pushed: "{user} запушил в {branch} — {commits}"
