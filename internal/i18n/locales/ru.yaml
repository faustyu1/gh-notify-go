forge:
  hook_title: "Вебхук {name}"
  hook:
    gitlab: "1. В GitLab открой проект (или группу) → <b>Settings → Webhooks</b> → <b>Add new webhook</b>.\n2. URL:\n<code>{url}</code>\n3. Secret token:\n<code>{token}</code>\n4. Триггеры: push и tag push, комментарии, issues, merge requests, пайплайны, wiki, деплои, релизы.\n5. Сохрани и нажми <b>Test → Push events</b>: проект появится в списке.\n\nОдин токен подходит для любого числа проектов и групп."
    gitea: "1. В Gitea открой репозиторий (или организацию) → <b>Настройки → Веб-хуки</b> → <b>Добавить веб-хук → Gitea</b>.\n2. URL:\n<code>{url}</code>\n3. Тип содержимого: <b>application/json</b>.\n4. Секрет:\n<code>{token}</code>\n5. События: push, создание и удаление веток и тегов, задачи, комментарии, pull requests, ревью, релизы, wiki.\n6. Сохрани, открой вебхук и нажми <b>Тестовая доставка</b>: репозиторий появится в списке.\n\nЭти адрес и секрет подходят для любого числа репозиториев."
    forgejo: "1. В Forgejo (и на Codeberg) открой репозиторий (или организацию) → <b>Настройки → Веб-хуки</b> → <b>Добавить веб-хук → Forgejo</b>.\n2. URL:\n<code>{url}</code>\n3. Тип содержимого: <b>application/json</b>.\n4. Секрет:\n<code>{token}</code>\n5. События: push, создание и удаление веток и тегов, задачи, комментарии, pull requests, ревью, релизы, wiki.\n6. Сохрани, открой вебхук и нажми <b>Тестовая доставка</b>: репозиторий появится в списке.\n\nЭти адрес и секрет подходят для любого числа репозиториев."
    gitverse: "1. В GitVerse открой репозиторий → <b>Настройки → Вебхуки</b> → добавь вебхук типа <b>Custom URL</b>.\n2. URL:\n<code>{url}</code>\n3. Заголовок Authorization:\n<code>{token}</code>\n4. События: все или выбранные — push, pull requests, задачи, комментарии, релизы.\n5. Сохрани и повтори доставку в <b>Последних рассылках</b> (или сделай push): репозиторий появится в списке.\n\nGitVerse ходит только на порты 80 и 443, поэтому адрес бота должен использовать один из них."
  projects_title: "{provider} · {name}"
  projects_empty: "От {provider} пока не было событий.\n\nДобавь вебхук в репозиторий и отправь тестовую доставку из его настроек — репозиторий появится здесь."
  projects_count: "Репозиториев: {n}"
  delete_confirm: "Удалить это подключение {provider}?\n\nЕго репозитории перестанут присылать события во все чаты, а запросы для него будут отклоняться. Удали вебхук и в самом {provider}."

