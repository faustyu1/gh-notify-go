    diffstat:
      one: " +{additions} −{deletions} в {files} файле"
      few: " +{additions} −{deletions} в {files} файлах"
      many: " +{additions} −{deletions} в {files} файлах"

  issues:
    opened: "{user} открыл issue {link}"
