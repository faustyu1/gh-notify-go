home:
  greeting: "Conecta GitHub, GitLab, Gitea, Forgejo o GitVerse y los eventos de tus repositorios llegarán a tus chats."
  accounts: "Cuentas"
  repos: "Repositorios"
  chats: "Chats"

accounts:
  empty: "Aún no hay cuentas conectadas."
  title: "Cuentas"
  hint: "Elige dónde está el repositorio."

repos:
  empty: "No hay repositorios seleccionados para esta instalación.\n\nAbre los ajustes de la GitHub App y añade repositorios."
  count: "Repositorios: {n}"
  page: "   ·   pág. {n}/{total}"

repo_detail:
  hint: "Elige el chat al que enviar los eventos de este repositorio."

install:
  title: "Conexión de GitHub"
  body: "Pulsa el botón de abajo, elige una cuenta u organización y marca los repositorios que necesites. GitHub te devolverá aquí después de la instalación."

forge:
  hook_title: "Webhook de {name}"
  hook:
    gitlab: "1. En GitLab abre el proyecto (o grupo) → <b>Settings → Webhooks</b> → <b>Add new webhook</b>.\n2. URL:\n<code>{url}</code>\n3. Secret token:\n<code>{token}</code>\n4. Disparadores: push y tag push, comentarios, issues, merge requests, pipelines, wiki, despliegues, releases.\n5. Guarda y pulsa <b>Test → Push events</b>: el proyecto aparecerá en la lista.\n\nUn mismo token sirve para cualquier número de proyectos y grupos."
    gitea: "1. En Gitea abre el repositorio (u organización) → <b>Configuración → Webhooks</b> → <b>Añadir webhook → Gitea</b>.\n2. URL de destino:\n<code>{url}</code>\n3. Tipo de contenido: <b>application/json</b>.\n4. Secreto:\n<code>{token}</code>\n5. Eventos: push, creación y eliminación de ramas y etiquetas, issues, comentarios, pull requests, revisiones, releases, wiki.\n6. Guarda, abre el webhook y pulsa <b>Probar entrega</b>: el repositorio aparecerá en la lista.\n\nEsta dirección y este secreto sirven para cualquier número de repositorios."
    forgejo: "1. En Forgejo (también en Codeberg) abre el repositorio (u organización) → <b>Configuración → Webhooks</b> → <b>Añadir webhook → Forgejo</b>.\n2. URL de destino:\n<code>{url}</code>\n3. Tipo de contenido: <b>application/json</b>.\n4. Secreto:\n<code>{token}</code>\n5. Eventos: push, creación y eliminación de ramas y etiquetas, issues, comentarios, pull requests, revisiones, releases, wiki.\n6. Guarda, abre el webhook y pulsa <b>Probar entrega</b>: el repositorio aparecerá en la lista.\n\nEsta dirección y este secreto sirven para cualquier número de repositorios."
    gitverse: "1. En GitVerse abre el repositorio → <b>Configuración → Webhooks</b> → añade un webhook de tipo <b>Custom URL</b>.\n2. URL:\n<code>{url}</code>\n3. Cabecera Authorization:\n<code>{token}</code>\n4. Eventos: todos o los que elijas — push, pull requests, issues, comentarios, releases.\n5. Guarda y reenvía una entrega desde <b>Últimos envíos</b> (o haz un push): el repositorio aparecerá en la lista.\n\nGitVerse solo llega a los puertos 80 y 443, así que la dirección del bot debe usar uno de ellos."
  projects_title: "{provider} · {name}"
  projects_empty: "Todavía no hay eventos de {provider}.\n\nAñade el webhook a un repositorio y envía una entrega de prueba desde sus ajustes: el repositorio aparecerá aquí."
  projects_count: "Repositorios: {n}"
  delete_confirm: "¿Eliminar esta conexión de {provider}?\n\nSus repositorios dejarán de enviar eventos a todos los chats y las entregas para ella serán rechazadas. Elimina también el webhook en {provider}."

connect:
  title: "Otras plataformas"
  body: "GitLab, Gitea, Forgejo y GitVerse se conectan con un webhook: el bot te da una dirección y un secreto, y tú los añades a un repositorio, proyecto o grupo."

chat_picker:
  empty: "El bot todavía no está en ninguno de tus chats.\n\nAñádelo a un grupo y el chat aparecerá aquí."
  title: "¿A dónde enviar?"

add_to_chat:
  title: "Añadir al chat"
  body: "Pulsa el botón y elige un grupo: el bot aparecerá allí y enviará enseguida un botón de ajustes.\n\nDespués, el grupo aparecerá en la lista al conectar un repositorio."

result:
  ok: "<b>Listo</b>\n\n{name} está conectado.\nLos eventos ya fluyen: puedes ajustarlos en la sección «Chats»."
  not_admin: "<b>Se necesitan permisos de administrador</b>\n\nSolo un administrador del chat puede conectar repositorios."
  not_owner: "<b>Lo conectó otro administrador</b>\n\nSolo quien conectó este repositorio — o el propietario del chat — puede desconectarlo."
  topic_failed: "<b>No se creó el tema</b>\n\nEl chat debe tener temas activados y el bot necesita el permiso «Gestionar temas»."
  duplicate: "<b>Ya conectado</b>\n\n{name} ya envía eventos a este chat."
  error: "<b>No funcionó</b>\n\nInténtalo de nuevo dentro de un rato."

